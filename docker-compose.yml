services:
  postgres:
    image: postgres:18.1
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=go_social
      - POSTGRES_PASSWORD=password1234
      - POSTGRES_DB=go_social
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  go-social:
    build: .
    depends_on:
      - postgres
      - redis
    env_file:
      - cmd\api\.env
    ports:
      - 3000:3000
    restart: unless-stopped

  redis:
    image: redis:8.4
    mem_limit: 512m
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
