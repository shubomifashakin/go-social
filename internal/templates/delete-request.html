<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px;">
    <h2 style="color: #e53e3e;">Account Deletion Request</h2>
    <p>Hi {{.FirstName}},</p>
    <p>We received a request to delete your GO-Social account. Use the code below to confirm:</p>
    <div style="text-align: center; margin: 32px 0;">
        <span style="font-size: 36px; font-weight: bold; letter-spacing: 8px; color: #1a202c;">{{.Code}}</span>
    </div>
    <p>This code expires in <strong>5 minutes</strong>. If you did not request this, you can safely ignore this email.</p>
</div>
